# CI for Drey (Windows-first, see docs/07_deployment_view.md).
#
# One windows-latest job, one build, in pipeline order:
# lint -> typechecks -> unit tests -> build -> e2e (real Electron app)
# -> NSIS + portable pack -> packed-app smoke test -> artifacts.
#
# Every run uploads the two exes as workflow artifacts (downloadable from
# the run page); a `v*` tag push additionally attaches them to a GitHub
# Release (public, permanent download).
#
# Caching: ELECTRON_CACHE / ELECTRON_BUILDER_CACHE are redirected into the
# workspace so actions/cache can pick them up without Windows path
# expansion issues (the electron binary ~120 MB, electron-builder's
# winCodeSign + NSIS toolchain ~100 MB -- only paid once per lockfile).
# fetch-depth: 0 because scripts/stamp-build.mjs uses `git rev-list --count
# HEAD` as the build number (depth 1 would always stamp 1).

name: CI

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: write

jobs:
  windows:
    name: Build, test & package (Windows)
    runs-on: windows-latest
    timeout-minutes: 60
    env:
      ELECTRON_CACHE: ${{ github.workspace }}\.cache\electron
      ELECTRON_BUILDER_CACHE: ${{ github.workspace }}\.cache\electron-builder
    steps:
      - name: Checkout (full history for the build stamp)
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Node 24
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Cache Electron + electron-builder downloads
        uses: actions/cache@v4
        with:
          path: |
            .cache/electron
            .cache/electron-builder
          key: electron-cache-${{ runner.os }}-${{ hashFiles('package-lock.json') }}

      - name: Install dependencies
        run: npm ci

      # npm ci does not materialize the transformers nested-sharp junction
      # the lockfile records (electron-builder's node-modules collector
      # stats that exact path and ENOENTs without it). The published
      # transformers package does not ship its tools/stubs folder, so the
      # junction points at the repo's own sharp stub -- the same package the
      # root `sharp` dependency resolves to (ADR-0055's WASM-only setup).
      # No-op wherever the junction already exists (dev machines).
      - name: Restore transformers sharp-stub junction
        shell: pwsh
        run: |
          $root = (Get-Location).Path
          $link = Join-Path $root "node_modules/@huggingface/transformers/node_modules/sharp"
          $stub = Join-Path $root "tools/stubs/sharp-stub"
          if (-not (Test-Path (Join-Path $link "package.json"))) {
            if (Test-Path $link) { Remove-Item $link -Force -Recurse }
            New-Item -ItemType Directory -Force -Path (Split-Path $link) | Out-Null
            New-Item -ItemType Junction -Path $link -Target $stub | Out-Null
          }
          "sharp stub resolvable: $(Test-Path (Join-Path $link 'package.json'))"

      - name: Lint
        run: npm run lint

      - name: Typecheck main + shared
        run: node node_modules/typescript/bin/tsc -p electron/tsconfig.json --noEmit

      - name: Typecheck main-process specs
        run: node node_modules/typescript/bin/tsc -p electron/tsconfig.spec.json

      - name: Typecheck renderer
        run: node node_modules/typescript/bin/tsc -p tsconfig.app.json --noEmit

      - name: Unit tests (Angular/renderer)
        run: npm run test -- --watch=false

      - name: Unit tests (plugins)
        run: npm run test:plugins

      # The diagrams plugin's draw.io web app (ADR-0064) is not in git:
      # `npm run pack` fetches it, but this job builds and packs in separate
      # steps, so it has to fetch it itself -- BEFORE the build, which copies
      # plugins/drawio/vendor/ into dist-electron/. Without it the drawio e2e
      # tests skip and the packed app ships no editor (verify:pack fails).
      # The script is idempotent on its .version stamp, so a cache hit makes
      # it a no-op; the pin file is the cache key.
      - name: Cache the draw.io web app
        uses: actions/cache@v4
        with:
          path: plugins/drawio/vendor
          key: drawio-webapp-${{ hashFiles('plugins/drawio/drawio-version.json', 'scripts/fetch-drawio.mjs') }}

      - name: Fetch the draw.io web app
        run: npm run fetch:drawio

      - name: Build (renderer + main + plugins)
        run: npm run build

      - name: E2E (Playwright drives the built Electron app)
        env:
          # ADR-0068: the sample plugin is an e2e fixture, NOT part of the
          # plain `npm run build` above -- rebuild the plugin output with it
          # before playwright starts (what `npm run e2e` does locally, minus
          # the redundant renderer rebuild). Packaging never ships it:
          # electron-builder.yml excludes it, verify:pack asserts absence.
          DREY_BUILD_SAMPLE_PLUGINS: 1
        run: npm run build:plugins && npm run e2e:run

      - name: Report display size (e2e layout debugging)
        if: always()
        run: |
          Add-Type -AssemblyName System.Windows.Forms
          [System.Windows.Forms.Screen]::AllScreens | ForEach-Object { $_.Bounds }

      - name: Upload e2e failure diagnostics
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: e2e-diagnostics-${{ github.sha }}
          path: |
            test-results/
            playwright-report/
          if-no-files-found: ignore
          retention-days: 7

      # pack = clean + build + electron-builder --win; the clean build above
      # is the same tree the e2e suite just passed on, so invoke
      # electron-builder directly (by script path, per repo convention).
      # (The e2e step also dropped the sample plugin into dist-electron/ --
      # the !dist-electron/plugins/sample/** rule keeps it out of the exes.)
      # --publish never: releases are attached by the softprops step below,
      # not by electron-builder's implicit CI publishing.
      - name: Package (NSIS setup + portable exe)
        run: node node_modules/electron-builder/cli.js --win --publish never

      - name: Smoke-test the packed app
        run: npm run verify:pack

      - name: Upload exes as workflow artifacts
        uses: actions/upload-artifact@v4
        with:
          name: drey-windows-${{ github.sha }}
          path: |
            release/drey-*-setup.exe
            release/drey-*-portable.exe
          if-no-files-found: error
          retention-days: 14

      - name: Attach exes to GitHub Release (v* tags only)
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: |
            release/drey-*-setup.exe
            release/drey-*-portable.exe
          generate_release_notes: true
