<div class="shell">
  @if (showWork()) {
    <mc-work class="pane pane-work" />
  }
  @if (showEmpty()) {
    <mc-empty class="pane pane-center" />
  }
  @if (showTeam()) {
    <mc-team class="pane pane-center" />
  }
  @if (personaOpen() !== null) {
    <div class="persona-layer">
      <mc-persona-detail />
    </div>
  }
  @if (showChat()) {
    <mc-chat class="pane pane-chat" />
  }
  <div class="ticket-layer" [class.open]="ticketOpen() !== null">
    <mc-ticket />
    <mc-ticket-edit />
  </div>
  <mc-toast />
  <nav class="tabbar" aria-label="Primary">
    <button type="button" class="tab" [class.on]="tab() === 'work'" (click)="tab.set('work')">
      <svg
        class="tab-icon"
        viewBox="0 0 24 24"
        fill="none"
        stroke="currentColor"
        stroke-width="1.8"
        stroke-linecap="round"
        aria-hidden="true"
      >
        <rect x="4" y="4" width="16" height="16" rx="3" />
        <path d="M4 10h16M10 10v10" />
      </svg>
      Work
      @if (needsCount() > 0) {
        <span class="bdg">{{ needsCount() }}</span>
      }
    </button>
    <button
      type="button"
      class="tab center"
      [class.on]="tab() === 'chat'"
      (click)="tab.set('chat')"
    >
      <span class="cbtn" aria-hidden="true">
        <svg
          viewBox="0 0 24 24"
          fill="none"
          stroke="currentColor"
          stroke-width="1.8"
          stroke-linecap="round"
          stroke-linejoin="round"
        >
          <path d="M21 12a8 8 0 0 1-8 8H4l2-3a8 8 0 1 1 15-5z" />
          <path d="M9 11.5h6M9 14.5h3.5" />
        </svg>
      </span>
      Chat
    </button>
    <button type="button" class="tab" [class.on]="tab() === 'team'" (click)="tab.set('team')">
      <svg
        class="tab-icon"
        viewBox="0 0 24 24"
        fill="none"
        stroke="currentColor"
        stroke-width="1.8"
        stroke-linecap="round"
        aria-hidden="true"
      >
        <circle cx="9" cy="8" r="3.2" />
        <path d="M3.5 19c.6-3 2.8-4.6 5.5-4.6s4.9 1.6 5.5 4.6" />
        <circle cx="17" cy="9" r="2.4" />
        <path d="M15.5 14.7c2.4.2 4.3 1.7 4.9 4.3" />
      </svg>
      Team
    </button>
    <button
      type="button"
      class="theme-btn"
      (click)="toggleTheme()"
      [attr.aria-label]="'Switch theme (current: ' + theme() + ')'"
      [attr.title]="'Switch theme (current: ' + theme() + ')'"
    >
      <svg
        viewBox="0 0 24 24"
        fill="none"
        stroke="currentColor"
        stroke-width="1.8"
        stroke-linecap="round"
        aria-hidden="true"
      >
        <circle cx="12" cy="12" r="8" />
        <path d="M12 4a8 8 0 0 1 0 16z" fill="currentColor" stroke="none" />
      </svg>
    </button>
  </nav>
</div>
