<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Drey: Settings, Tickets</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<style>
.ib{width:30px;height:30px;flex-shrink:0;display:flex;align-items:center;justify-content:center;padding:0;background:transparent;border:0;border-radius:4px;color:#b3b7bc}
.ib:hover{background:#2c2d31;color:#f4f5f6}
.ib[aria-pressed="true"]{background:#2c2d31;color:#f4f5f6}
.ph{height:28px;flex-shrink:0;display:flex;align-items:center;gap:4px;padding:0 6px 0 4px;cursor:grab}
.ph:hover{background:#2c2d31}
.pc{width:20px;height:20px;display:flex;align-items:center;justify-content:center;padding:0;background:transparent;border:0;border-radius:4px;color:#b3b7bc}
.pt{font-size:13px;font-weight:600;color:#f4f5f6}
.pn{font-size:13px;color:#b3b7bc;margin-left:4px}
.pa{margin-left:auto;display:flex;gap:2px;opacity:0;transition:opacity .15s}
.ph:hover .pa,.ph:focus-within .pa{opacity:1}
.vt{height:26px;padding:0 12px;display:flex;align-items:center;background:transparent;border:0;border-radius:4px;color:#b3b7bc;font:inherit;font-size:14px}
.vt[aria-selected="true"]{background:#2c2d31;color:#f4f5f6;font-weight:600}
.mi{height:32px;padding:0 8px;display:flex;align-items:center;gap:8px;text-align:left;background:transparent;border:0;border-radius:4px;color:#f4f5f6;font:inherit;font-size:14px}
.mi:hover{background:#3b3d42}
body{margin:0}
button{cursor:default}
</style>
</helmet>
<div style="width: 1440px; height: 900px; display: flex; flex-direction: column; background: #18191b; color: #f4f5f6; font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Inter, Roboto, Helvetica, Arial, sans-serif; font-size: 13px; line-height: 18px; overflow: hidden"><header style="height: 40px; flex-shrink: 0; display: flex; align-items: center; gap: 2px; padding: 0 8px; background: #222326; border-bottom: 1px solid #3b3d42; position: relative; z-index: 4"><span aria-hidden="true" style="width: 22px; height: 22px; border-radius: 4px; background: #8ecbef; color: #101113; display: flex; align-items: center; justify-content: center; font-weight: 700; font-size: 13px; margin-right: 6px">D</span><button type="button" class="ib" aria-label="Toggle left dock"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="3" y="4" width="18" height="16" rx="2"></rect><path d="M9 4v16"></path></svg></button><button type="button" style="height: 28px; padding: 0 8px; background: transparent; border: 0; border-radius: 4px; color: #f4f5f6; font: inherit; font-size: 14px">File</button><button type="button" style="height: 28px; padding: 0 8px; background: transparent; border: 0; border-radius: 4px; color: #f4f5f6; font: inherit; font-size: 14px">Edit</button><button type="button" style="height: 28px; padding: 0 8px; background: transparent; border: 0; border-radius: 4px; color: #f4f5f6; font: inherit; font-size: 14px">Selection</button><button type="button" style="height: 28px; padding: 0 8px; background: transparent; border: 0; border-radius: 4px; color: #f4f5f6; font: inherit; font-size: 14px">View</button><button type="button" style="height: 28px; padding: 0 8px; background: transparent; border: 0; border-radius: 4px; color: #f4f5f6; font: inherit; font-size: 14px">Help</button><button type="button" class="ib" aria-label="Back"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M19 12H5M12 19l-7-7 7-7"></path></svg></button><button type="button" class="ib" aria-label="Forward" style="color: #b3b7bc"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M5 12h14M12 5l7 7-7 7"></path></svg></button><span style="width: 12px"></span><div style="position: relative; display: flex; align-items: center; background: #18191b; border: 1px solid #3b3d42; border-radius: 8px; padding: 2px"><div role="tablist" aria-label="View" style="display: flex; gap: 2px"><button type="button" role="tab" class="vt" aria-selected="false" title="Ctrl+1">Notes</button><button type="button" role="tab" class="vt" aria-selected="true" title="Ctrl+2">Work</button><button type="button" role="tab" class="vt" aria-selected="false" title="Ctrl+3">Crew</button></div><span aria-hidden="true" style="width: 1px; height: 18px; background: #3b3d42; margin: 0 4px"></span><button type="button" aria-haspopup="menu" aria-expanded="false" aria-label="Layout of this view: save, reset, rename or delete" style="height: 26px; padding: 0 6px 0 8px; display: flex; align-items: center; gap: 4px; background: transparent; border: 0; border-radius: 4px; color: #b3b7bc; font: inherit; font-size: 13px">Layout<svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M6 9l6 6 6-6"></path></svg></button></div><span style="flex-grow: 1"></span><button type="button" class="ib" aria-label="Toggle right dock"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="3" y="4" width="18" height="16" rx="2"></rect><path d="M15 4v16"></path></svg></button><span style="width: 8px"></span><button type="button" class="ib" aria-label="Minimize" style="width: 40px"><svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M5 12h14"></path></svg></button><button type="button" class="ib" aria-label="Maximize" style="width: 40px"><svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="4" y="4" width="16" height="16" rx="1"></rect></svg></button><button type="button" class="ib" aria-label="Close window" style="width: 40px"><svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M18 6L6 18M6 6l12 12"></path></svg></button></header><div style="flex-grow: 1; display: flex; min-height: 0"><div style="flex-grow: 1; display: flex; flex-direction: column; min-height: 0; min-width: 0">
  <div style="height: 36px; flex-shrink: 0; display: flex; align-items: flex-end; background: #222326; border-bottom: 1px solid #3b3d42">
    <div style="height: 36px; display: flex; align-items: center; padding: 0 14px; color: #b3b7bc; border-right: 1px solid #3b3d42; white-space: nowrap">T-0017 · A8 large modules</div>
    <div style="height: 36px; display: flex; align-items: center; gap: 8px; padding: 0 10px 0 14px; background: #18191b; color: #f4f5f6; border-right: 1px solid #3b3d42; white-space: nowrap">Settings<svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="#747980" stroke-width="2" stroke-linecap="round" aria-hidden="true"><path d="M18 6L6 18M6 6l12 12"></path></svg></div>
  </div>
  <div style="flex-shrink: 0; display: flex; flex-direction: column; gap: 10px; padding: 14px 24px 0">
    <div style="display: flex; align-items: center; gap: 8px; height: 36px; padding: 0 6px 0 12px; background: #2c2d31; border: 1px solid #747980; border-radius: 8px">
      <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="#b3b7bc" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="11" cy="11" r="7"></circle><path d="M21 21l-4.3-4.3"></path></svg>
      <label for="set-q" style="position: absolute; width: 1px; height: 1px; overflow: hidden">Search settings</label>
      <input id="set-q" type="search" value="{{query}}" onInput="{{onQuery}}" placeholder="Search settings" style="flex-grow: 1; min-width: 0; height: 32px; background: transparent; border: 0; color: #f4f5f6; font: inherit; font-size: 14px; outline: none">
      <span style="color: #b3b7bc; font-size: 13px; white-space: nowrap">{{found}}</span>
      <button type="button" class="ib" aria-pressed="{{modOnly}}" onClick="{{toggleMod}}" aria-label="Show only changed settings" title="Show only changed settings"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M3 5h18l-7 8v6l-4 2v-8z"></path></svg></button>
      <button type="button" class="ib" onClick="{{clearQuery}}" aria-label="Clear search" title="Clear search"><svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" aria-hidden="true"><path d="M18 6L6 18M6 6l12 12"></path></svg></button>
    </div>
    <div role="tablist" aria-label="Scope" style="display: flex; gap: 2px; border-bottom: 1px solid #3b3d42">
      <sc-for list="{{scopes}}" as="sc" hint-placeholder-count="3">
        <button type="button" role="tab" aria-selected="{{sc.on}}" onClick="{{sc.pick}}" style="height: 34px; padding: 0 12px; background: transparent; border: 0; border-bottom: 2px solid {{sc.bar}}; color: {{sc.fg}}; font: inherit; font-size: 14px; font-weight: {{sc.weight}}">{{sc.name}}</button>
      </sc-for>
      <span style="flex-grow: 1"></span>
      <span style="align-self: center; color: #b3b7bc; font-size: 13px">{{scopeNote}}</span>
    </div>
  </div>
  <div style="flex-grow: 1; min-height: 0; display: flex">
    <nav aria-label="Settings sections" style="width: 240px; flex-shrink: 0; overflow-y: auto; display: flex; flex-direction: column; gap: 1px; padding: 12px 8px; border-right: 1px solid #3b3d42">
      <sc-for list="{{tree}}" as="n" hint-placeholder-count="14">
        <button type="button" onClick="{{n.pick}}" aria-expanded="{{n.expanded}}" aria-current="{{n.current}}" style="height: 30px; display: flex; align-items: center; gap: 6px; padding: 0 8px 0 {{n.indent}}px; background: {{n.bg}}; border: 0; border-radius: 4px; color: {{n.fg}}; font: inherit; font-size: 14px; font-weight: {{n.weight}}; text-align: left">
          <span aria-hidden="true" style="width: 14px; height: 14px; flex-shrink: 0; display: flex; color: #b3b7bc">
            <sc-if value="{{n.isOpen}}" hint-placeholder-val="{{false}}"><svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round"><path d="M6 9l6 6 6-6"></path></svg></sc-if>
            <sc-if value="{{n.isClosed}}" hint-placeholder-val="{{true}}"><svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round"><path d="M9 6l6 6-6 6"></path></svg></sc-if>
          </span>
          <span style="flex-grow: 1; min-width: 0; white-space: nowrap; overflow: hidden; text-overflow: ellipsis">{{n.name}}</span>
          <span style="color: #b3b7bc; font-size: 13px; font-weight: 400">{{n.hits}}</span>
        </button>
      </sc-for>
    </nav>
    <div style="flex-grow: 1; min-width: 0; overflow-y: auto; padding: 18px 32px 32px">
      <div style="max-width: 760px; display: flex; flex-direction: column">
        <h1 style="margin: 0 0 4px; font-size: 26px; line-height: 34px; font-weight: 700">{{heading}}</h1>
        <sc-if value="{{empty}}" hint-placeholder-val="{{false}}">
          <p style="margin: 16px 0 0; color: #b3b7bc">No setting matches “{{query}}”. Try another word, or clear the search.</p>
        </sc-if>
        <sc-for list="{{groups}}" as="g" hint-placeholder-count="3">
          <h2 style="margin: 22px 0 4px; font-size: 18px; line-height: 26px; font-weight: 600">{{g.name}}</h2>
          <sc-for list="{{g.items}}" as="it" hint-placeholder-count="3">
            <div style="display: flex; flex-direction: column; gap: 6px; padding: 12px 0 12px 14px; margin-left: -14px; border-left: 2px solid {{it.bar}}">
              <div style="display: flex; align-items: baseline; gap: 8px"><span style="font-size: 14px"><span style="color: #b3b7bc">{{it.path}}</span><b>{{it.name}}</b></span><span style="color: #b3b7bc; font-size: 13px">{{it.modLabel}}</span></div>
              <sc-if value="{{it.isCheck}}" hint-placeholder-val="{{false}}">
                <label style="display: flex; align-items: flex-start; gap: 10px; color: #b3b7bc; font-size: 14px; line-height: 21px"><input type="checkbox" checked="{{it.on}}" onChange="{{it.toggle}}" style="width: 18px; height: 18px; margin: 2px 0 0; accent-color: #8ecbef; flex-shrink: 0"><span>{{it.desc}}</span></label>
              </sc-if>
              <sc-if value="{{it.isField}}" hint-placeholder-val="{{true}}">
                <span style="color: #b3b7bc; font-size: 14px; line-height: 21px">{{it.desc}}</span>
                <div style="display: flex; gap: 8px; align-items: center">
                  <input type="text" aria-label="{{it.name}}" value="{{it.value}}" style="width: {{it.width}}px; height: 32px; padding: 0 10px; background: #2c2d31; border: 1px solid #747980; border-radius: 4px; color: #f4f5f6; font: inherit; font-size: 14px">
                  <span style="color: #b3b7bc; font-size: 13px">{{it.unit}}</span>
                </div>
              </sc-if>
              <sc-if value="{{it.isAction}}" hint-placeholder-val="{{false}}">
                <span style="color: #b3b7bc; font-size: 14px; line-height: 21px">{{it.desc}}</span>
                <div style="display: flex; gap: 8px; align-items: center"><span style="font-size: 14px">{{it.value}}</span><button type="button" style="height: 30px; padding: 0 12px; background: transparent; border: 1px solid #747980; border-radius: 4px; color: #f4f5f6; font: inherit; font-size: 13px">{{it.action}}</button></div>
              </sc-if>
            </div>
          </sc-for>
        </sc-for>
      </div>
    </div>
  </div>
</div></div><div style="height: 28px; flex-shrink: 0; display: flex; align-items: center; gap: 16px; padding: 0 12px; background: #222326; border-top: 1px solid #3b3d42; color: #b3b7bc"><span>Settings</span><span style="flex-grow: 1"></span><button type="button" aria-haspopup="dialog" aria-expanded="false" title="Autopilot: On (Mod+Alt+P)" style="height: 28px; display: flex; align-items: center; gap: 6px; padding: 0 10px; background: transparent; border: 0; color: #f4f5f6; font: inherit; font-size: 13px; white-space: nowrap; flex-shrink: 0"><span aria-hidden="true" style="width: 8px; height: 8px; border-radius: 50%; background: #93c47f; flex-shrink: 0"></span>Autopilot · On</button><span>Settings</span></div></div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":1440,"height":900}}'>
class Component extends DCLogic {
  constructor(props) {
    super(props);
    this.state = {
      query: '',
      modOnly: false,
      scope: 'All devices',
      sel: 'Tickets',
      open: { Tickets: true, Assistant: false, Editor: false },
      checks: { pause: true, videos: false, serve: true, autoCopy: false }
    };
  }
  renderVals() {
    const st = this.state;
    const T = 'Tickets';
    const items = [
      { cat: 'Appearance', sub: 'Theme', name: 'Color theme', desc: 'The look of every window.', kind: 'action', value: 'Anthrazit', action: 'Change…' },
      { cat: 'Appearance', sub: 'Text', name: 'Text size', desc: 'Body text in notes and tickets. L is 17 px.', kind: 'field', value: 'L', width: 80 },
      { cat: 'Assistant', sub: 'Models', name: 'Default model', desc: 'Used when you talk to the model directly, not to Mission Control.', kind: 'action', value: 'glm-5.3-flash', action: 'Change…' },
      { cat: 'Assistant', sub: 'Context', name: 'Vault context', desc: 'How many note sections the Assistant may read per question.', kind: 'field', value: '4', unit: 'sections', width: 80 },
      { cat: 'Editor', sub: 'Typing', name: 'Spellcheck languages', desc: 'Dictionaries used while you type.', kind: 'field', value: 'de, en', width: 200 },
      { cat: T, sub: 'Crew', name: 'Personas', desc: 'Default crew for new tickets. Add more, for example a security reviewer.', kind: 'action', value: 'Paul, Ben, Ralf, Tessa', action: 'Edit crew' },
      { cat: T, sub: 'Flow', name: 'Default flow', desc: 'Steps a new ticket runs through unless its plan says otherwise.', kind: 'action', value: 'Plan → Build → Review → Test', action: 'Open flow editor' },
      { cat: T, sub: 'Autopilot', name: 'Autopilot', desc: 'What starts next: On (workers pick up tickets by themselves), Paused (running steps finish, nothing new starts) or Off (you start every step). Also in the status bar and with Mod+Alt+P.', kind: 'action', value: 'On', action: 'Change…' },
      { cat: T, sub: 'Autopilot', name: 'Resume paused autopilot at', desc: 'A paused autopilot switches itself on again at this time.', kind: 'field', value: '18:00', unit: 'every day', width: 100 },
      { cat: T, sub: 'Budget and runners', name: 'Daily budget', desc: 'Pause new runs when it is spent.', kind: 'field', value: '15', unit: 'USD per day', width: 100, mod: true },
      { cat: T, sub: 'Budget and runners', name: 'Pause when the budget is spent', desc: 'Running work finishes first; nothing new starts.', kind: 'check', key: 'pause' },
      { cat: T, sub: 'Budget and runners', name: 'Runners', desc: 'Where builds run and how many at once.', kind: 'action', value: 'Local 2 · Claude Code 3 · opencode 1', action: 'Manage' },
      { cat: T, sub: 'Walkthrough videos', name: 'Keep videos in Git', desc: 'Videos are large and stay in the history once committed. Off keeps them in tickets/videos only.', kind: 'check', key: 'videos' },
      { cat: T, sub: 'Walkthrough videos', name: 'Largest video', desc: 'One limit per video. Nothing is removed automatically.', kind: 'field', value: '25', unit: 'MB', width: 80 },
      { cat: T, sub: 'Devices', name: 'Serve the phone and iPad app', desc: 'Runs without Drey open, port 47811. The Tailscale address is part of the pairing code.', kind: 'check', key: 'serve' },
      { cat: T, sub: 'Devices', name: 'Pair a device', desc: 'Shows a code and a QR; the code expires after 10 minutes.', kind: 'action', value: '2 paired: Henrik’s iPhone, iPad', action: 'Show pairing code' }
    ];
    const tree = [
      { name: 'Commonly used', cat: 'Common' },
      { name: 'Appearance', cat: 'Appearance' },
      { name: 'Assistant', cat: 'Assistant', kids: ['Models', 'Context'] },
      { name: 'Editor', cat: 'Editor', kids: ['Typing'] },
      { name: 'Files', cat: 'Files' },
      { name: 'Keyboard shortcuts', cat: 'Keys' },
      { name: 'MCP server', cat: 'MCP' },
      { name: 'Panels and plugins', cat: 'Panels' },
      { name: 'Tickets', cat: T, kids: ['Crew', 'Flow', 'Autopilot', 'Budget and runners', 'Walkthrough videos', 'Devices'] },
      { name: 'Vault', cat: 'Vault' },
      { name: 'About', cat: 'About' }
    ];
    const q = st.query.trim().toLowerCase();
    const hit = (it) => (!q || (it.name + ' ' + it.desc + ' ' + it.sub + ' ' + it.cat).toLowerCase().indexOf(q) >= 0) && (!st.modOnly || it.mod);
    const pool = q || st.modOnly ? items.filter(hit) : items.filter((it) => it.cat === st.sel || it.sub === st.sel);
    const groupNames = [];
    pool.forEach((it) => { const g = q || st.modOnly ? it.cat + ' › ' + it.sub : it.sub; if (groupNames.indexOf(g) < 0) groupNames.push(g); });
    const rows = [];
    tree.forEach((n) => {
      const hits = q ? items.filter((it) => it.cat === n.cat && hit(it)).length : 0;
      const isOpen = !!(n.kids && (st.open[n.name] || (q && hits)));
      rows.push({ name: n.name, indent: 6, isOpen, isClosed: !!n.kids && !isOpen, expanded: n.kids ? String(isOpen) : 'false', current: st.sel === n.name ? 'page' : 'false', bg: st.sel === n.name && !q ? '#2c2d31' : 'transparent', fg: q && !hits ? '#747980' : '#f4f5f6', weight: st.sel === n.name ? 600 : 400, hits: q && hits ? String(hits) : '',
        pick: () => this.setState({ sel: n.name, query: '', open: n.kids ? { ...st.open, [n.name]: !st.open[n.name] } : st.open }) });
      if (isOpen) n.kids.forEach((k) => {
        const kh = q ? items.filter((it) => it.cat === n.cat && it.sub === k && hit(it)).length : 0;
        rows.push({ name: k, indent: 28, isOpen: false, isClosed: false, expanded: 'false', current: st.sel === k ? 'page' : 'false', bg: st.sel === k && !q ? '#2c2d31' : 'transparent', fg: q && !kh ? '#747980' : '#f4f5f6', weight: st.sel === k ? 600 : 400, hits: kh ? String(kh) : '', pick: () => this.setState({ sel: k, query: '' }) });
      });
    });
    const scopes = ['All devices', 'This device', 'This vault'].map((n) => ({ name: n, on: st.scope === n, bar: st.scope === n ? '#f4f5f6' : 'transparent', fg: st.scope === n ? '#f4f5f6' : '#b3b7bc', weight: st.scope === n ? 600 : 400, pick: () => this.setState({ scope: n }) }));
    return {
      query: st.query,
      modOnly: String(st.modOnly),
      onQuery: (e) => this.setState({ query: e.target.value }),
      clearQuery: () => this.setState({ query: '', modOnly: false }),
      toggleMod: () => this.setState({ modOnly: !st.modOnly }),
      found: q || st.modOnly ? pool.length + (pool.length === 1 ? ' setting' : ' settings') : '',
      scopes,
      scopeNote: st.scope === 'This device' ? 'Overrides for this computer only' : st.scope === 'This vault' ? 'Stored in the vault, shared by everyone who opens it' : 'Synced to every device you pair',
      tree: rows,
      heading: q ? 'Search results' : st.modOnly ? 'Changed settings' : st.sel,
      empty: pool.length === 0,
      groups: groupNames.map((g) => ({
        name: g,
        items: pool.filter((it) => (q || st.modOnly ? it.cat + ' › ' + it.sub : it.sub) === g).map((it) => ({
          ...it,
          path: q || st.modOnly ? '' : '',
          unit: it.unit || '',
          width: it.width || 200,
          isCheck: it.kind === 'check',
          isField: it.kind === 'field',
          isAction: it.kind === 'action',
          on: !!st.checks[it.key],
          toggle: () => this.setState({ checks: { ...st.checks, [it.key]: !st.checks[it.key] } }),
          bar: it.mod ? '#8ecbef' : 'transparent',
          modLabel: it.mod ? 'Changed · default 10' : ''
        }))
      }))
    };
  }
}
</script>
</body>
</html>
