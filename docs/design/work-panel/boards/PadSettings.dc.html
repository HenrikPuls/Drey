div style="height: 44px; flex-shrink: 0; display: flex; align-items: center; padding: 0 16px; border-bottom: 1px solid #2c2d31"><b style="font-size: 15px">Categories</b></div><a href="PadSettings.dc.html" style="min-height: 52px; flex-shrink: 0; display: flex; align-items: center; gap: 10px; padding: 0 16px; background: #2c2d31; color: #f4f5f6; text-decoration: none; font-size: 16px"><span style="flex-grow: 1">Appearance</span><span style="color: #b3b7bc; font-size: 13px">3 settings</span></a><a href="PadSettings.dc.html" style="min-height: 52px; flex-shrink: 0; display: flex; align-items: center; gap: 10px; padding: 0 16px; background: transparent; color: #f4f5f6; text-decoration: none; font-size: 16px"><span style="flex-grow: 1">Assistant</span><span style="color: #b3b7bc; font-size: 13px">2 settings</span></a><a href="PadSettings.dc.html" style="min-height: 52px; flex-shrink: 0; display: flex; align-items: center; gap: 10px; padding: 0 16px; background: transparent; color: #f4f5f6; text-decoration: none; font-size: 16px"><span style="flex-grow: 1">Editor</span><span style="color: #b3b7bc; font-size: 13px">1 setting</span></a><a href="PadSettings.dc.html" style="min-height: 52px; flex-shrink: 0; display: flex; align-items: center; gap: 10px; padding: 0 16px; background: transparent; color: #f4f5f6; text-decoration: none; font-size: 16px"><span style="flex-grow: 1">Tickets</span><span style="color: #b3b7bc; font-size: 13px">9 settings</span></a></aside>

<section aria-label="Settings" style="flex: 1 1 0; display: flex; flex-direction: column; min-width: 0; overflow: hidden">
  <div style="height: 52px; flex-shrink: 0; display: flex; align-items: center; gap: 12px; padding: 0 16px; border-bottom: 1px solid #3b3d42">
    <b style="font-size: 17px; line-height: 22px">Settings</b>

  </div>
  <div style="flex-shrink: 0; display: flex; flex-direction: column; gap: 10px; padding: 12px 16px; border-bottom: 1px solid #3b3d42">
    <div style="display: flex; align-items: center; gap: 8px; height: 48px; padding: 0 6px 0 12px; background: #2c2d31; border-radius: 12px">
      <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#b3b7bc" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" style="flex-shrink: 0"><circle cx="11" cy="11" r="7"></circle><path d="M21 21l-4.3-4.3"></path></svg>

      <input id="set-q" type="search" value="{{query}}" onInput="{{onQuery}}" placeholder="Search settings" style="flex-grow: 1; min-width: 0; height: 44px; background: transparent; border: 0; color: #f4f5f6; font: inherit; font-size: 17px; padding: 0; outline: none">

      <button type="button" onClick="{{clearQuery}}" aria-label="Clear search" title="Clear search" style="width: 44px; height: 44px; flex-shrink: 0; display: flex; align-items: center; justify-content: center; padding: 0; border: 0; border-radius: 8px; background: transparent; color: #b3b7bc"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M6 6l12 12M18 6L6 18"></path></svg></button>
    </div>
    <div role="tablist" aria-label="Scope" style="display: flex; gap: 2px; padding: 2px; background: #222326; border-radius: 12px; align-self: flex-start">
      <sc-for list="{{scopes}}" as="sc" hint-placeholder-count="3">
        <button type="button" role="tab" aria-selected="{{sc.on}}" onClick="{{sc.pick}}" style="height: 44px; padding: 0 18px; border: 0; border-radius: 10px; background: {{sc.bg}}; color: {{sc.fg}}; font: inherit; font-size: 15px; font-weight: {{sc.weight}}; white-space: nowrap">{{sc.name}}</button>
      </sc-for>
    </div>
  </div>
  <div style="flex-grow: 1; min-height: 0; overflow-y: auto; display: flex; flex-direction: column; gap: 10px; padding: 12px 16px 24px">
    <sc-if value="{{empty}}" hint-placeholder-val="{{false}}">
      <p style="margin: 0; padding: 12px 4px; color: #b3b7bc">No setting matches “{{query}}”. Try another word, or clear the search.</p>
    </sc-if>
    <sc-for list="{{sections}}" as="s" hint-placeholder-count="4">
      <div style="flex-shrink: 0; display: flex; flex-direction: column; background: #222326; border: 1px solid #3b3d42; border-radius: 8px; overflow: hidden">
        <button type="button" aria-expanded="{{s.open}}" onClick="{{s.pick}}" style="min-height: 52px; display: flex; align-items: center; gap: 12px; padding: 0 16px; background: {{s.bg}}; border: 0; color: #f4f5f6; font: inherit; text-align: left">
          <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="#b3b7bc" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" style="flex-shrink: 0; transform: rotate({{s.rot}}deg)"><path d="M9 6l6 6-6 6"></path></svg>
          <b style="flex-grow: 1; min-width: 0; font-size: 17px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis">{{s.name}}</b>
          <span style="flex-shrink: 0; color: #b3b7bc; font-size: 13px; white-space: nowrap">{{s.count}}</span>
        </button>
        <sc-if value="{{s.open}}" hint-placeholder-val="{{false}}">
          <div style="display: flex; flex-direction: column; padding: 0 16px 8px; border-top: 1px solid #3b3d42">
            <sc-for list="{{s.groups}}" as="g" hint-placeholder-count="2">
              <span style="padding: 14px 0 4px; color: #b3b7bc; font-size: 13px; line-height: 18px; letter-spacing: 0.02em">{{g.name}}</span>
              <sc-for list="{{g.items}}" as="it" hint-placeholder-count="3">
                <div style="display: flex; align-items: center; gap: 16px; min-height: 64px; padding: 8px 0; border-top: 1px solid #2c2d31">
                  <div style="flex: 1 1 0; min-width: 0; display: flex; flex-direction: column; gap: 2px">
                    <div style="display: flex; align-items: center; gap: 8px; min-width: 0"><b style="font-weight: 600; min-width: 0; white-space: nowrap; overflow: hidden; text-overflow: ellipsis">{{it.name}}</b><span style="flex-shrink: 0; color: #f2cfae; font-size: 13px; white-space: nowrap">{{it.modLabel}}</span></div>
                    <span style="color: #b3b7bc; font-size: 15px; line-height: 20px">{{it.desc}}</span>
                  </div>
                  <sc-if value="{{it.isCheck}}" hint-placeholder-val="{{false}}">
                    <input type="checkbox" role="switch" class="sw" aria-label="{{it.name}}" checked="{{it.on}}" onChange="{{it.toggle}}">
                  </sc-if>
                  <sc-if value="{{it.isField}}" hint-placeholder-val="{{true}}">
                    <div style="flex-shrink: 0; display: flex; align-items: center; gap: 8px"><input type="text" aria-label="{{it.name}}" value="{{it.value}}" style="width: {{it.width}}px; height: 44px; box-sizing: border-box; padding: 0 12px; background: #18191b; border: 1px solid #3b3d42; border-radius: 8px; color: #f4f5f6; font: inherit; font-size: 15px"><span style="color: #b3b7bc; font-size: 13px; white-space: nowrap">{{it.unit}}</span></div>
                  </sc-if>
                  <sc-if value="{{it.isAction}}" hint-placeholder-val="{{false}}">
                    <div style="flex-shrink: 0; max-width: 340px; display: flex; align-items: center; gap: 12px"><span style="min-width: 0; color: #b3b7bc; font-size: 15px; line-height: 20px; text-align: right; white-space: nowrap; overflow: hidden; text-overflow: ellipsis">{{it.value}}</span><button type="button" style="height: 44px; flex-shrink: 0; padding: 0 14px; background: transparent; color: #f4f5f6; border: 1px solid #747980; border-radius: 8px; font: inherit; font-size: 15px; white-space: nowrap">{{it.action}}</button></div>

<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":1194,"height":834}}'>
class Component extends DCLogic {
  constructor(props) {
    super(props);
    this.state = {
      query: '',
      modOnly: false,
      scope: 'All devices',
      open: { Appearance: true, Assistant: false, Editor: false, Tickets: false },
      checks: { pause: true, videos: false, serve: true }
    };
  }
  renderVals() {
    const st = this.state;
    const T = 'Tickets';
    const items = [
      { sec: 'Appearance', sub: 'Theme', name: 'Color theme', desc: 'The look of every window.', kind: 'action', value: 'Anthrazit', action: 'Change…' },
      { sec: 'Appearance', sub: 'Text', name: 'Text size', desc: 'Body text in notes and tickets. L is 17 px.', kind: 'field', value: 'L', width: 80 },
      { sec: 'Appearance', sub: 'Layout', name: 'Open sidebars', desc: 'Landscape opens all three panes, portrait only the list. Your last choice is remembered for each orientation.', kind: 'action', value: 'Landscape: all three · Portrait: list only', action: 'Change…' },
      { sec: 'Assistant', sub: 'Models', name: 'Default model', desc: 'Used when you talk to the model directly, not to Mission Control.', kind: 'action', value: 'glm-5.3-flash', action: 'Change…' },
      { sec: 'Assistant', sub: 'Context', name: 'Vault context', desc: 'How many note sections the Assistant may read per question.', kind: 'field', value: '4', unit: 'sections', width: 80 },
      { sec: 'Editor', sub: 'Typing', name: 'Spellcheck languages', desc: 'Dictionaries used while you type.', kind: 'field', value: 'de, en', width: 160 },
      { sec: T, sub: 'Crew', name: 'Personas', desc: 'Default team for new tickets. Add more, for example a security reviewer.', kind: 'action', value: 'Paul, Ben, Ralf, Tessa', action: 'Edit team' },
      { sec: T, sub: 'Flow', name: 'Default flow', desc: 'Steps a new ticket runs through unless its plan says otherwise.', kind: 'action', value: 'Plan → Build → Review → Test', action: 'Open flow editor' },
      { sec: T, sub: 'Budget and runners', name: 'Daily budget', desc: 'Pause new runs when it is spent.', kind: 'field', value: '15', unit: 'USD per day', width: 80, mod: true },
      { sec: T, sub: 'Budget and runners', name: 'Pause when the budget is spent', desc: 'Running work finishes first; nothing new starts.', kind: 'check', key: 'pause' },
      { sec: T, sub: 'Budget and runners', name: 'Runners', desc: 'Where builds run and how many at once.', kind: 'action', value: 'Local 2 · Claude Code 3 · opencode 1', action: 'Manage' },
      { sec: T, sub: 'Walkthrough videos', name: 'Keep videos in Git', desc: 'Videos are large and stay in the history once committed. Off keeps them in tickets/videos only.', kind: 'check', key: 'videos' },
      { sec: T, sub: 'Walkthrough videos', name: 'Largest video', desc: 'One limit per video. Nothing is removed automatically.', kind: 'field', value: '25', unit: 'MB', width: 80 },
      { sec: T, sub: 'Devices', name: 'Serve the phone and iPad app', desc: 'Runs without Drey open, port 47811. The Tailscale address is part of the pairing code.', kind: 'check', key: 'serve' },
      { sec: T, sub: 'Devices', name: 'Pair a device', desc: 'Shows a code and a QR; the code expires after 10 minutes.', kind: 'action', value: '2 paired: Henrik’s iPhone, iPad', action: 'Show pairing code' }
    ];
    const order = ['Appearance', 'Assistant', 'Editor', T];
    const q = st.query.trim().toLowerCase();
    const searching = !!q || st.modOnly;
    const hit = (it) => (!q || (it.name + ' ' + it.desc + ' ' + it.sub + ' ' + it.sec).toLowerCase().indexOf(q) >= 0) && (!st.modOnly || it.mod);
    let total = 0;
    const sections = [];
    order.forEach((name) => {
      const mine = items.filter((it) => it.sec === name && hit(it));
      total += mine.length;
      if (searching && !mine.length) return;
      const open = searching ? true : !!st.open[name];
      const groupNames = [];
      mine.forEach((it) => { if (groupNames.indexOf(it.sub) < 0) groupNames.push(it.sub); });
      sections.push({
        name,
        open,
        rot: open ? 90 : 0,
        bg: open ? '#2c2d31' : 'transparent',
        count: mine.length + (mine.length === 1 ? ' setting' : ' settings'),
        pick: () => this.setState({ open: { ...st.open, [name]: !st.open[name] } }),
        groups: groupNames.map((g) => ({
          name: g,
          items: mine.filter((it) => it.sub === g).map((it) => ({
            name: it.name,
            desc: it.desc,
            modLabel: it.mod ? 'Changed' : '',
            value: it.value || '',
            unit: it.unit || '',
            width: it.width || 80,
            action: it.action || '',
            isCheck: it.kind === 'check',
            isField: it.kind === 'field',
            isAction: it.kind === 'action',
            on: it.kind === 'check' ? !!st.checks[it.key] : false,
            toggle: () => this.setState({ checks: { ...st.checks, [it.key]: !st.checks[it.key] } })
          }))
        }))
      });
    });
    const scopeNotes = {
      'All devices': 'Saved with the engine, applies to every paired device',
      'This device': 'Saved on this iPad only, changes apply at once',
      'This vault': 'Saved in the vault, shared through Git'
    };
    return {
      query: st.query,
      modOnly: String(st.modOnly),
      modBg: st.modOnly ? '#2c2d31' : 'transparent',
      modFg: st.modOnly ? '#f4f5f6' : '#b3b7bc',
      found: searching ? total + (total === 1 ? ' match' : ' matches') : '',
      empty: searching && total === 0,
      scopeNote: scopeNotes[st.scope],
      onQuery: (e) => this.setState({ query: e.target.value }),
      toggleMod: () => this.setState({ modOnly: !st.modOnly }),
      clearQuery: () => this.setState({ query: '', modOnly: false }),
      scopes: ['All devices', 'This device', 'This vault'].map((n) => ({
        name: n,
        on: String(st.scope === n),
        bg: st.scope === n ? '#2c2d31' : 'transparent',
        fg: st.scope === n ? '#f4f5f6' : '#b3b7bc',
        weight: st.scope === n ? 600 : 400,
        pick: () => this.setState({ scope: n })
      })),
      sections
    };
  }
}
</script>
