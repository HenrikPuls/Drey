# Windows packaging for Drey (electron-builder). See
# docs/07_deployment_view.md and
# docs/09_architecture_decisions/0023-windows-packaging-electron-builder.md.
#
# Build inputs must be current: `npm run pack` cleans + `npm run build`
# (renderer -> dist/drey/browser, main -> dist-electron) first.

appId: de.lariscus.drey
productName: drey
copyright: Copyright © 2026 Henrik Puls

# The in-app updater's source (milestone 82, ADR-0074): GitHub Releases.
# With a publish config present, electron-builder writes `latest.yml`
# (the version + SHA512 manifest electron-updater reads), the
# `*.exe.blockmap` files (differential downloads) and the packaged
# `app-update.yml` even under `--publish never` — CI attaches them to the
# release; the app never publishes itself.
publish:
  provider: github
  owner: HenrikPuls
  repo: Drey

directories:
  # NOT the default `dist/` -- Angular owns dist/drey/.
  output: release
  buildResources: build

asar: true
asarUnpack:
  # ESM packages that read their own .aff/.dic via import.meta.url --
  # must be real files, not asar entries.
  - '**/node_modules/dictionary-de/**'
  - '**/node_modules/dictionary-en/**'
  # Spawned by an EXTERNAL `node` (an MCP client) -- cannot live in the asar.
  - 'dist-electron/electron/mcp/stdio-bridge.js'

files:
  - 'dist-electron/**/*.js'
  - 'dist-electron/**/*.json'
  # Plugin renderer stylesheets (the .js/.json globs above already carry
  # the plugin mains, manifests and renderer modules).
  - 'dist-electron/plugins/**/*.css'
  # The draw.io web app the diagrams plugin embeds (ADR-0064): every file
  # type, served as-is over plugin://. Present only after
  # `npm run fetch:drawio` -- `npm run pack` runs it.
  - 'dist-electron/plugins/drawio/webapp/**'
  - 'dist/drey/browser/**'
  - 'package.json'
  - '!dist-electron/**/*.map'
  # Orphaned tsc output (tsc never cleans outDir); `npm run pack` also
  # wipes dist-electron/ first, this is belt-and-braces.
  - '!dist-electron/electron/quick-capture.js'
  - '!dist-electron/electron/timestamp.js'
  - '!dist-electron/electron/zoom.js'
  # The sample plugin is the executable authoring reference
  # (plugins/AUTHORING.md) and dev/e2e fixture — still built into
  # dist-electron/, but never shipped in the installer / portable exe.
  - '!dist-electron/plugins/sample/**'

# The BrowserWindow / taskbar icon at runtime (win.icon below covers the
# exe + installer). Copied to resources/ ; main.ts reads it from
# process.resourcesPath when packaged. Keep this list to {from,to} entries
# only -- a bare negation string here makes electron-builder default the
# positive pattern to the whole project root and recurse into release/.
extraResources:
  - from: build/icon.ico
    to: icon.ico
  - from: build/icon.png
    to: icon.png
  # The mark of a theme that has its own (req-42, shared/app-icon.ts): the
  # window / taskbar icon while that theme is on. The exe keeps win.icon.
  - from: build/icon-cyberpunk.ico
    to: icon-cyberpunk.ico

# Explorer "Open with" / default-program registration (ADR-0054). NSIS only:
# a per-user install writes HKCU/Software/Classes entries, the uninstaller
# removes them; the portable build registers nothing. Keep the extensions in
# step with shared/external-open.ts (EXTERNAL_OPEN_EXTENSIONS), which is what
# main accepts from argv. NOTE: the NSIS macro also claims the class default
# for each extension, so a .txt the user never explicitly bound to another
# app (Windows' UserChoice) starts opening in Drey.
fileAssociations:
  # `name` becomes the ProgId (the registry class key) and the uninstaller
  # deletes it again -- so it must be unique to Drey, never a generic label
  # another program might register too; `description` is what Explorer shows.
  - ext: [md, markdown, mdx]
    name: Drey.Markdown
    description: Markdown document
    role: Editor
  - ext: txt
    name: Drey.Text
    description: Text document
    role: Editor

win:
  target:
    - nsis
    - portable
  icon: build/icon.ico

nsis:
  oneClick: false
  perMachine: false
  allowElevation: true
  allowToChangeInstallationDirectory: true
  license: LICENSE
  artifactName: ${productName}-${version}-setup.${ext}

portable:
  artifactName: ${productName}-${version}-portable.${ext}
