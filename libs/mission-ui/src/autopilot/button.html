@if (view(); as current) {
  <button type="button" class="btn" [class.open]="open()" aria-haspopup="dialog" [attr.aria-label]="label()" [attr.title]="label()" (click)="open.set(true)">
    <mc-ph-icon [name]="glyph()" />
    <span class="dot" [attr.data-tone]="tone()" aria-hidden="true"></span>
  </button>
  @if (open()) {
    <div class="scrim" (click)="open.set(false)"></div>
    <section class="sheet" role="dialog" aria-modal="true" [attr.aria-label]="'autopilot.title' | t">
      <mc-autopilot-panel [sheet]="true" (done)="open.set(false)" />
    </section>
  }
}
