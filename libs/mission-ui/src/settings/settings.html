<section class="settings" aria-label="Settings">
  <h1 class="ttl">Settings</h1>
  <div class="group">
    <button type="button" class="row" (click)="switchTheme()">
      <span class="grow">Theme</span>
      <span class="val">{{ themeLabel() }}</span>
    </button>
  </div>
  <p class="note">Appearance is saved on this device only.</p>
</section>
