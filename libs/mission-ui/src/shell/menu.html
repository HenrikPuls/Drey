<div class="menu">
  <header class="head">
    <h1 class="ttl">Menu</h1>
  </header>

  <label class="search">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true">
      <circle cx="11" cy="11" r="7" />
      <path d="M20 20l-4-4" />
    </svg>
    <input type="search" aria-label="Search" placeholder="Search" [value]="query()" (input)="onQuery($event)" />
  </label>

  <nav class="places" aria-label="Places">
    @if (notesEnabled()) {
      <button type="button" class="row" (click)="place.emit('notes')">
        <span class="grow">Notes</span>
        <span class="chev" aria-hidden="true">›</span>
      </button>
    }
    <button type="button" class="row" (click)="place.emit('work')">
      <span class="grow">Work</span>
      @if (needsCount() > 0) {
        <span class="bdg">{{ needsCount() }}</span>
      }
      <span class="chev" aria-hidden="true">›</span>
    </button>
    <button type="button" class="row" (click)="place.emit('crew')">
      <span class="grow">Crew</span>
      <span class="chev" aria-hidden="true">›</span>
    </button>
    <button type="button" class="row" (click)="place.emit('settings')">
      <span class="grow">Settings</span>
      <span class="chev" aria-hidden="true">›</span>
    </button>
  </nav>

  <section class="chats" aria-label="Chats with Mission Control">
    <h2 class="cap">Mission Control</h2>
    <button type="button" class="row new" (click)="newChat.emit()">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true">
        <path d="M12 5v14M5 12h14" />
      </svg>
      <span class="grow">New chat</span>
    </button>
    @for (group of groups(); track group.label) {
      <h3 class="group">{{ group.label }}</h3>
      @for (entry of group.entries; track entry.file) {
        <button type="button" class="row sess" [class.cur]="entry.file === activeFile()" (click)="openChat.emit(entry)">
          <span class="grow st">{{ entry.title }}</span>
          @if (entry.pending > 0) {
            <span class="bdg" [attr.aria-label]="entry.pending + ' cards waiting'">{{ entry.pending }}</span>
          }
          <small class="when">{{ age(entry) }}</small>
        </button>
      }
    }
    @if (sessions().length === 0) {
      <p class="hint">No chat yet.</p>
    }
  </section>
</div>
