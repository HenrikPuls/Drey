@if (vm.editing()) {
  <section class="editor" aria-label="Raw edit">
    <p class="warning" role="alert">
      <span class="warning-glyph" aria-hidden="true">⚠</span>
      Raw mode — this file is the machine interface. A stray character breaks parsers. The chat is
      the safe way to change a ticket.
    </p>
    <textarea
      class="raw"
      [value]="text()"
      (input)="onInput($event)"
      aria-label="Ticket file text"
      autocomplete="off"
      autocapitalize="off"
      autocorrect="off"
      spellcheck="false"
    ></textarea>
    @if (saveError(); as error) {
      <div class="conflict" role="alert">
        <p class="conflict-text">{{ error }}</p>
        <button type="button" class="btn conflict-reload" [disabled]="busy()" (click)="onReload()">
          Reload
        </button>
      </div>
    }
    <footer class="actions">
      <button type="button" class="btn ghost" [class.armed]="armed()" (click)="onCancel()">
        {{ armed() ? 'Discard changes?' : 'Cancel' }}
      </button>
      <button type="button" class="btn accent" [disabled]="!canSave()" (click)="onSave()">
        {{ busy() ? 'Saving…' : 'Save' }}
      </button>
    </footer>
  </section>
}
