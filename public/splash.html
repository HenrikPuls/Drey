<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>drey</title>
    <style>
      /*
        The startup splash (milestone 62, ADR-0062): shown before anything
        heavy runs, closed at the hidden-until-ready handover. Deliberately
        dependency-free — inline CSS + a few lines of JS over the splash
        preload's `onProgress` — so it paints the moment the window loads,
        long before the renderer bundle would. Token values are copied from
        the Anthrazit block of src/styles.css — the default theme (the
        splash cannot import the sheet, and it shows before the config
        that names the user's theme is read; keep in step when the palette
        changes).
      */
      html,
      body {
        margin: 0;
        height: 100%;
        background: #18191b;
        color: #f4f5f6;
        font-family: ui-sans-serif, system-ui, -apple-system, 'Segoe UI', 'Helvetica Neue', sans-serif;
        -webkit-font-smoothing: antialiased;
        user-select: none;
        cursor: default;
        overflow: hidden;
      }
      .stage {
        height: 100%;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        gap: 14px;
      }
      /*
        The wordmark is the logo plus three letters: the mark already draws
        the "d", so "rey" is set after it on the same baseline, sized so its
        x-height sits just under the mark's bowl (0.77 of the image; Segoe UI's
        x-height is half its size) — together they read "drey". The letters
        take the cream of the mark's outline, the line that draws the "d";
        pure white overpowered the mark.
      */
      .wordmark {
        display: flex;
        align-items: baseline;
      }
      .mark {
        width: 80px;
        height: 80px;
        position: relative;
        top: 3px; /* drops the "d" onto the text baseline */
      }
      .rest {
        margin-left: -8px; /* the image's own transparent margin */
        font-size: 110px;
        line-height: 1;
        font-weight: 600;
        letter-spacing: -0.01em;
        color: #ead4bc;
      }
      .version {
        font-family: ui-monospace, 'Cascadia Code', 'Consolas', monospace;
        font-size: 11px;
        color: #979ca2;
        min-height: 14px; /* reserves the line before main sends the value */
      }
      .track {
        width: 216px;
        height: 3px;
        border-radius: 2px;
        background: #2c2d31;
        margin-top: 10px;
        overflow: hidden;
      }
      .fill {
        height: 100%;
        width: 3%;
        border-radius: 2px;
        background: #8ecbef;
        transition: width 220ms ease-out;
      }
      .activity {
        font-size: 12.5px;
        color: #b3b7bc;
        min-height: 16px; /* no layout jump while the label changes */
      }
    </style>
  </head>
  <body>
    <div class="stage" aria-label="drey is starting">
      <div class="wordmark" role="img" aria-label="drey">
        <img class="mark" src="icon.png" alt="" draggable="false" /><span class="rest">rey</span>
      </div>
      <div class="version" id="version"></div>
      <div class="track"><div class="fill" id="fill"></div></div>
      <div class="activity" id="activity">Starting…</div>
    </div>
    <script>
      const fill = document.getElementById('fill');
      const activity = document.getElementById('activity');
      const version = document.getElementById('version');
      window.splashApi?.onProgress?.((p) => {
        if (typeof p?.pct === 'number') {
          fill.style.width = `${Math.max(0, Math.min(100, p.pct))}%`;
        }
        if (typeof p?.label === 'string' && p.label !== '') {
          activity.textContent = p.label;
        }
        if (typeof p?.version === 'string' && p.version !== '') {
          version.textContent = p.version;
        }
      });
    </script>
  </body>
</html>
