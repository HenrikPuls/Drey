@if (pending(); as req) {
  <div class="backdrop" appOverlayGuard (click)="onCancel()"></div>
  <div class="dialog" role="dialog" aria-modal="true" aria-labelledby="confirm-title">
    <header>
      <h2 id="confirm-title">{{ req.title }}</h2>
      @if (req.summary) {
        <p class="summary">{{ req.summary }}</p>
      }
    </header>

    <div class="preview">
      <app-diff-view
        [before]="req.before"
        [after]="req.after"
        [mode]="req.previewStyle === 'localized' ? 'inline' : 'split'"
      />
    </div>

    <footer>
      @if (req.triggerId) {
        <label class="dont-ask">
          <input
            type="checkbox"
            [checked]="dontAskAgain()"
            (change)="dontAskAgain.set($any($event.target).checked)"
          />
          Don’t ask again for this action
        </label>
      }
      <div class="spacer"></div>
      <button type="button" class="ghost" (click)="onCancel()">Cancel</button>
      <button type="button" class="primary" (click)="onConfirm()">Apply</button>
    </footer>
  </div>
}
