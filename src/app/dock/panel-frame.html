<div
  class="head"
  role="button"
  tabindex="0"
  [attr.aria-expanded]="!collapsed()"
  [attr.aria-label]="(collapsed() ? 'Expand ' : 'Collapse ') + title()"
  title="Click to collapse · drag to move this panel"
  (mousedown)="onHeaderPress($event)"
  (keydown)="onHeaderKey($event)"
>
  <span class="title">{{ title() }}</span>
  @if (status(); as s) {
    <span class="status">{{ s }}</span>
  }
  <span class="grip" aria-hidden="true"> <i></i><i></i><i></i><i></i><i></i><i></i> </span>
</div>

<div class="body-wrap" [class.collapsed]="collapsed()">
  <div class="body" [class.body--flush]="flush()">
    <ng-content />
  </div>
</div>
