<div
  class="head"
  role="button"
  tabindex="0"
  [attr.aria-label]="'Hide ' + title()"
  title="Click to hide · drag to move this panel"
  (mousedown)="onHeaderPress($event)"
  (keydown)="onHeaderKey($event)"
>
  @if (!titleReplaced()) {
    <span class="title">{{ title() }}</span>
    @if (status(); as s) {
      <span class="status">{{ s }}</span>
    }
  }
  @if (headerActions(); as tpl) {
    <div
      class="head-actions"
      [class.fill]="titleReplaced()"
      (mousedown)="onActionsPress($event)"
      (keydown)="$event.stopPropagation()"
    >
      <ng-container [ngTemplateOutlet]="tpl" />
    </div>
  }
  @if (headerActionsMount() && !headerActions()) {
    <div
      class="head-actions"
      (mousedown)="$event.stopPropagation()"
      (keydown)="$event.stopPropagation()"
    >
      <div #pluginActions></div>
    </div>
  }
  <span class="grip" aria-hidden="true"> <i></i><i></i><i></i><i></i><i></i><i></i> </span>
</div>

<div class="body-wrap">
  <div class="body" [class.body--flush]="flush()">
    <ng-content />
  </div>
</div>
