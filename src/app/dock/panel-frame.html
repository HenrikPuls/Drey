<!-- i18n: catalog -->
<div
  class="head"
  [attr.title]="'dock.panel.header_hint' | t"
  (mousedown)="onHeaderPress($event)"
  (contextmenu)="openMenu($event)"
>
  <button
    type="button"
    class="chevron"
    [attr.aria-expanded]="!collapsed()"
    [attr.aria-label]="(collapsed() ? 'dock.panel.expand' : 'dock.panel.collapse') | t: { panel: title() }"
    (mousedown)="$event.stopPropagation()"
    (click)="toggleCollapsed()"
  >
    <app-icon [name]="collapsed() ? 'chevron-right' : 'chevron-down'" [size]="12" [strokeWidth]="2" />
  </button>
  @if (!titleReplaced()) {
    <span class="title">{{ title() }}</span>
    @if (status(); as s) {
      <span class="status">{{ s }}</span>
    }
  }
  @if (headerActions(); as tpl) {
    <div
      class="head-actions"
      [class.fill]="titleReplaced()"
      (mousedown)="onActionsPress($event)"
      (keydown)="$event.stopPropagation()"
    >
      <ng-container [ngTemplateOutlet]="tpl" />
    </div>
  }
  @if (headerActionsMount() && !headerActions()) {
    <div
      class="head-actions"
      (mousedown)="$event.stopPropagation()"
      (keydown)="$event.stopPropagation()"
    >
      <div class="plugin-actions" #pluginActions></div>
    </div>
  }
</div>

@if (menu(); as m) {
  <div
    class="ctx-backdrop"
    appOverlayGuard
    (click)="closeMenu()"
    (contextmenu)="$event.preventDefault(); closeMenu()"
  ></div>
  <div class="ctx-menu" role="menu" [style.left.px]="m.x" [style.top.px]="m.y">
    @for (side of moveTargets(); track side) {
      <button type="button" role="menuitem" (click)="moveTo(side)">{{ 'dock.panel.move_' + side | t }}</button>
    }
    <div class="ctx-sep" role="separator"></div>
    <button type="button" role="menuitem" (click)="closePanel()">{{ 'common.close' | t }}</button>
  </div>
}

<div class="body-wrap" [class.folded]="collapsed()">
  <div class="body" [class.body--flush]="flush()">
    <ng-content />
  </div>
</div>
