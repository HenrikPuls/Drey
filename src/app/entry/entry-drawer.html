<div class="drawer-inner">
  <div class="thema-field">
    <label for="entry-topic">TOPIC</label>
    <input
      id="entry-topic"
      type="text"
      autocomplete="off"
      placeholder="What is this entry about? (recommended)"
      [value]="drawer.topic()"
      (input)="drawer.setTopic($any($event.target).value)"
    />
  </div>

  <div class="tag-row">
    <span class="tr-label">TAGS</span>
    <app-autotag-button />
    <!-- The shared tag chip field (milestone 33): colored chips + a
         completion dropdown from the tag vocabulary, the exact component
         the Search/Tasks panels get through `api.ui.createTagField`. -->
    <div #tagFieldHost class="chip-field"></div>
    <!-- Show/hide the formatting toolbar in the body field below (own
         persisted pref, hidden by default). -->
    <button
      type="button"
      class="tb-toggle"
      [class.on]="prefs.entryToolbar()"
      [attr.aria-pressed]="prefs.entryToolbar()"
      title="Formatting toolbar"
      aria-label="Formatting toolbar"
      (click)="prefs.toggleEntryToolbar()"
    >
      <app-icon name="type" [size]="13" />
    </button>
  </div>

  <!-- The shared Markdown surface in compact mode, with the inline
       spellchecker mixed in (red wavy underline + click popup). -->
  <app-markdown-surface
    class="md-editor"
    [compact]="true"
    [submitOnEnter]="false"
    [toolbar]="prefs.entryToolbar()"
    [spellcheck]="spellcheckSource"
    [imageCapture]="true"
    [onLinkActivate]="activateLink"
    [onWikilinkActivate]="activateWikilink"
    placeholder="What happened? (Markdown)"
    (docChanged)="drawer.setText($event)"
  />

  @if (editor.error(); as error) {
    <p class="err">{{ error }}</p>
  }

  <div class="drawer-actions">
    <span class="count">{{ bodyCount() }}</span>
    <button type="button" class="btn" [disabled]="!drawer.hasContent()" (click)="discard()">
      Discard
    </button>
    <button type="button" class="btn primary" [disabled]="!canSubmit()" (click)="submit()">
      {{ editor.isSaving() ? 'Adding…' : 'Add to document' }}
    </button>
  </div>
</div>
