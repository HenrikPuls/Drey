<div class="meta">
  <span class="path" [title]="path()">{{ path() }}</span>
</div>

<div class="body">
  @if (url(); as frameUrl) {
    <iframe class="frame" [src]="frameUrl" [title]="path()"></iframe>
  } @else {
    <div class="empty">
      <p>This PDF's path could not be resolved.</p>
    </div>
  }
</div>
