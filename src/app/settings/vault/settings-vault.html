<app-settings-pane
  title="Vault"
  description="How the app keeps up with changes made outside the app."
>
  @if (vault(); as vault) {
    <label class="switch-row">
      <input
        type="checkbox"
        [checked]="vault.watch"
        (change)="onWatchChange($any($event.target).checked)"
      />
      <span>
        <span class="switch-label">Watch the vault for external changes</span>
        <span class="switch-hint">
          When another program (a sync service, a second editor) changes a file in the vault, the
          file tree, the search and task indexes update on their own, and open tabs without
          unsaved edits reload from disk. Tabs with unsaved edits are never overwritten. Off by
          default — the refresh button does the same thing manually.
        </span>
      </span>
    </label>
    <div class="field">
      <label for="vault-update-links">When a note is renamed or moved</label>
      <select
        id="vault-update-links"
        [value]="vault.updateLinksOnRename"
        (change)="onUpdateLinksChange($any($event.target).value)"
      >
        <option value="ask" [selected]="vault.updateLinksOnRename === 'ask'">
          Ask before updating links
        </option>
        <option value="always" [selected]="vault.updateLinksOnRename === 'always'">
          Always update links
        </option>
        <option value="never" [selected]="vault.updateLinksOnRename === 'never'">
          Never update links
        </option>
      </select>
      <p class="field-hint">
        Renaming or moving a note in the Files panel rewrites the links that point to it, and
        attachments used only by a moved note move along with it. An attachment other notes use
        too stays where it is and the moved note's link is adjusted instead.
      </p>
    </div>
  }
</app-settings-pane>
