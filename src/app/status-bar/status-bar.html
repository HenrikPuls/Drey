@if (editor.activeKind() === 'image') {
  <span class="count">{{ imageInfo() }}</span>
} @else if (editor.activeKind() === 'browser') {
  <span class="count url" [title]="browserUrl()">{{ browserUrl() }}</span>
} @else {
  <span class="count">{{ editor.wordCount() }} words</span>
  <span class="dot">·</span>
  <span class="count">{{ editor.charCount() }} chars</span>
}
<button type="button" class="settings" (click)="settings.openScreen()" aria-label="Settings">
  <app-icon name="settings" [size]="12" />
  <span>Settings</span>
</button>
