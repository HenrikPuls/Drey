@for (doc of editor.openDocs(); track doc.path) {
  <div
    class="tab"
    role="tab"
    [class.active]="doc.path === editor.activePath()"
    [attr.aria-selected]="doc.path === editor.activePath()"
    (click)="editor.activate(doc.path)"
    (contextmenu)="openMenu($event, doc.path)"
    [title]="doc.path"
  >
    <span class="name">{{ doc.name }}</span>
    @if (doc.bufferContent !== doc.savedContent) {
      <span class="dirty" aria-label="Unsaved changes"></span>
    }
    <button
      type="button"
      class="close"
      (click)="onClose($event, doc.path)"
      [attr.aria-label]="'Close ' + doc.name"
    >
      <app-icon name="x" [size]="8" [strokeWidth]="1.4" />
    </button>
  </div>
}

<button type="button" class="add" (click)="editor.newUntitled()" aria-label="New note">
  <app-icon name="plus" [size]="11" [strokeWidth]="1.2" />
</button>

@if (menu(); as m) {
  <div
    class="ctx-backdrop"
    (click)="closeMenu()"
    (contextmenu)="$event.preventDefault(); closeMenu()"
  ></div>
  <div class="ctx-menu" [style.left.px]="m.x" [style.top.px]="m.y">
    <button type="button" (click)="closeOthers(m.path)">Close others</button>
    <button type="button" (click)="closeAll()">Close all</button>
  </div>
}
