@if (library.pickerOpen()) {
  <div class="backdrop" appOverlayGuard (click)="library.closePicker()"></div>
  <div class="panel" role="dialog" aria-label="Insert template">
    <input
      #filterInput
      class="filter"
      type="text"
      placeholder="Search templates…"
      [value]="filter()"
      (input)="onFilter($any($event.target).value)"
      (keydown.arrowDown)="$event.preventDefault(); move(1)"
      (keydown.arrowUp)="$event.preventDefault(); move(-1)"
      (keydown.enter)="$event.preventDefault(); confirmActive()"
    />

    <div class="list">
      @for (t of visible(); track t.relativePath; let i = $index) {
        @if (recentCount() > 0 && i === 0) {
          <div class="section">Recent</div>
        }
        @if (recentCount() > 0 && i === recentCount()) {
          <div class="section">All templates</div>
        }
        <button
          type="button"
          class="row"
          [class.active]="i === activeIndex()"
          (mouseenter)="activeIndex.set(i)"
          (click)="choose(t)"
        >
          <span class="name">{{ t.name }}</span>
          <span class="path">{{ t.relativePath }}</span>
        </button>
      } @empty {
        <div class="none">No matching templates.</div>
      }
    </div>
  </div>
}
