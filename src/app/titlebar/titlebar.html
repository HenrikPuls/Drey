<div class="brand" [class.mac]="chrome.isMac()">
  <span class="mark" aria-hidden="true"></span>
  <span class="name">Drey</span>
</div>

<app-menu-bar />

<span class="spacer"></span>

@if (!chrome.isMac()) {
  <div class="controls">
    <button type="button" class="ctl" (click)="chrome.minimize()" aria-label="Minimize">
      <app-icon name="minus" [size]="9" [strokeWidth]="1.2" />
    </button>
    <button
      type="button"
      class="ctl"
      (click)="chrome.toggleMaximize()"
      [attr.aria-label]="chrome.maximized() ? 'Restore' : 'Maximize'"
    >
      <app-icon name="square" [size]="8" [strokeWidth]="1.2" />
    </button>
    <button type="button" class="ctl close" (click)="chrome.close()" aria-label="Close">
      <app-icon name="x" [size]="9" [strokeWidth]="1.2" />
    </button>
  </div>
}
